<!doctype html>
<html lang="en">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Market Replay 3</title><link rel="stylesheet" href="css/app.css"></head>
<body>
<header id="topbar"><strong>Market Replay 3</strong><span id="dataset-label">No data</span><div class="actions"><button id="btn-import">Import CSV</button><button id="btn-sample">Sample</button><button id="btn-session-save">Save session</button><button id="btn-session-open">Open session</button><button id="btn-replay-toggle" disabled>Start replay</button></div></header>
<section id="replaybar"><button id="btn-jump-start">|◀</button><button id="btn-step-back">◀</button><button id="btn-play">▶</button><button id="btn-step-fwd">▶</button><select id="speed-select"><option value="2000">0.5x</option><option value="1000" selected>1x</option><option value="500">2x</option><option value="250">4x</option><option value="100">10x</option></select><input id="scrubber" type="range" min="0" max="0" value="0" disabled><span id="bar-time">-</span></section>
<main><aside id="left-tools"><button data-tool="none">Cursor</button><button data-tool="segment">Line</button><button data-tool="horizontalStraightLine">Level</button><button data-tool="rectx">Box</button><button data-tool="measurex">Measure</button><button data-tool="trade">Trade</button><button id="btn-clear-draws">Clear drawings</button></aside><section id="chart-wrap"><div id="chart-container"></div><div id="chart-empty"><h2>Load market data</h2><p>Import OHLCV data or use the sample dataset.</p></div></section><aside id="trade-panel"><h3>Order desk</h3><div id="account"></div><label>Volume <input id="order-volume" type="number" value="1" step="any"></label><label>Stop loss <input id="order-sl" type="number" step="any"></label><label>Take profit <input id="order-tp" type="number" step="any"></label><div><button id="btn-sell">SELL</button><button id="btn-buy">BUY</button></div><h4>Positions</h4><div id="positions-list"></div><h4>Pending orders</h4><div id="pending-orders"></div></aside></main>
<section id="bottom-panel"><nav><button data-tab="history">Trades</button><button data-tab="stats">Performance</button><button data-tab="journal">Journal</button><button data-tab="pine">Pine</button></nav><div id="tab-history"><button id="btn-export-trades">Export CSV</button><table id="trades-table"><thead><tr><th>ID</th><th>Side</th><th>Entry</th><th>Exit</th><th>Net</th><th>R</th></tr></thead><tbody></tbody></table></div><div id="tab-stats" class="hidden"><div id="stats-grid"></div><canvas id="equity-canvas"></canvas></div><div id="tab-journal" class="hidden"><button id="btn-journal-shot">Save screenshot</button><div id="journal-list"></div></div><div id="tab-pine" class="hidden"><input id="pine-name" value="My Script"><button id="btn-pine-run">Run</button><button id="btn-pine-save">Save</button><button id="btn-pine-load">Load</button><button id="btn-pine-new">New</button><button id="btn-pine-remove">Remove</button><textarea id="pine-editor"></textarea><pre id="pine-console"></pre></div></section>
<div id="csv-modal" class="modal hidden"><div class="modal-card"><h3>Import market data</h3><input id="csv-file" type="file" accept=".csv,.txt,.tsv"><label>Symbol <input id="csv-symbol" value="SAMPLE"></label><label>Timeframe <select id="csv-tf"><option>M1</option><option>M5</option><option selected>M15</option><option>H1</option><option>H4</option><option>D1</option></select></label><button id="btn-csv-load">Load</button><button data-close="csv-modal">Cancel</button><p id="csv-status"></p></div></div>
<div id="pine-load-modal" class="modal hidden"><div class="modal-card"><h3>Saved Pine scripts</h3><ul id="pine-script-list"></ul><button data-close="pine-load-modal">Close</button></div></div><div id="toasts"></div>
<script src="vendor/klinecharts.min.js"></script><script src="vendor/codemirror.js"></script><script src="vendor/addon/edit/closebrackets.js"></script><script type="module" src="js/app.js"></script>
</body></html>
